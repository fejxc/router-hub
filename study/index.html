function visibleTrees(){let groups=DATA.children.map((g,i)=>({node:g,side:i%2===0?1:-1,children:expanded.has(g.id)?g.children.map(t=>({node:t,children:expanded.has(t.id)?t.children.map(l=>({node:l,children:[]})):[]})):[]}));return groups}

function makeEl(tag,attrs){let el=document.createElementNS(NS,tag);for(let [k,v]of Object.entries(attrs||{}))el.setAttribute(k,v);return el}
function layoutSide(groups,side){let relevant=groups.filter(g=>g.side===side);let unit=54, gap=86;let sizes=relevant.map(g=>countRows(g)*unit+gap);let current=-sizes.reduce((a,b)=>a+b,0)/2;const res=[];relevant.forEach((g,idx)=>{const total=countRows(g)*unit;let first=current+total/2;place(g,side,1,first,total,res);current+=sizes[idx]});return res}
function place(t,side,level,middle,total,output){const x=side*(level===1?256:level===2?545:990);const y=middle;output.push({node:t.node,x,y,side,level});const cc=t.children||[];if(cc.length){let y0=middle-total/2;cc.forEach(k=>{let h=countRows(k)*54;place(k,side,level+1,y0+h/2,h,output);y0+=h})}}
function shortText(text,level){let max=level===1?11:level===2?14:level===3?27:15;return text.length<=max?text:text.slice(0,max-1)+'…'}
function textWidth(level){return level===1?184:level===2?215:level===3?360:246}
function drawLine(from,to,side,color){let x1=from.x+side*(from.level===0?96:textWidth(from.level)/2-3),x2=to.x-side*(textWidth(to.level)/2-4);let dx=(x2-x1)*0.5;let p=makeEl('path',{d:`M ${x1} ${from.y} C ${x1+dx} ${from.y}, ${x2-dx} ${to.y}, ${x2} ${to.y}`,stroke:color,class:'link'});linkLayer.appendChild(p)}
function drawNode(p){let n=p.node,level=p.level,w=textWidth(level),h=level===0?85:level===1?45:level===2?39:35;let bg=level===0?'#203e85':level===1?(n.tone||'#365eaa'):level===2?'#fefefe':'#fff';let stroke=level===2?'#cbd9ed':'#d3deed';let fg=level<=1?'#fff':level===2?'#23466f':'#667792';let g=makeEl('g',{class:'node'+(searchMatches.has(n.id)?' match':''),transform:`translate(${p.x},${p.y})`,'data-id':n.id});const rc=makeEl('rect',{x:-w/2,y:-h/2,width:w,height:h,rx:level===0?20:level===1?12:9,fill:bg,stroke:level<=1?'none':stroke,'stroke-width':1.5});g.appendChild(rc);if(level===0){let a=makeEl('text',{'text-anchor':'middle','font-weight':'850','font-size':23,fill:'#fff',y:-10});a.textContent='资料分析';g.appendChild(a);let b=makeEl('text',{'text-anchor':'middle','font-size':12,fill:'#c9d7ff',y:16});b.textContent='七大知识模块';g.appendChild(b)}else{let tt=makeEl('text',{'text-anchor':'middle','font-size':level===1?15:level===2?12:11,'font-weight':level<=2?800:600,fill:fg,class:level===1?'toplabel':'minor'});tt.textContent=shortText(n.name,level);g.appendChild(tt)}
if(n.children?.length && level>0){let x=(p.side===1?w/2-2:-w/2+2),cy=0;let ee=makeEl('circle',{cx:x,cy,r:9,fill:'#fff',stroke:n.tone||'#96adca','stroke-width':1.2});g.appendChild(ee);let sym=makeEl('text',{x,'text-anchor':'middle',fill:'#496b9d','font-size':14,'font-weight':900});sym.textContent=expanded.has(n.id)?'−':'+';g.appendChild(sym)}
let to=null;g.addEventListener('click',e=>{e.stopPropagation();if(n.children?.length){expanded.has(n.id)?expanded.delete(n.id):expanded.add(n.id);render(false)}else showDetail(n)});g.addEventListener('dblclick',e=>{e.stopPropagation();showDetail(n)});g.appendChild(makeEl('title',{})).textContent=n.name;nodeLayer.appendChild(g)}
function render(fit=false){linkLayer.replaceChildren();nodeLayer.replaceChildren();let groups=visibleTrees();let pts=[{node:DATA,x:0,y:0,level:0,side:1},...layoutSide(groups,1),...layoutSide(groups,-1)];let lookup=new Map(pts.map(p=>[p.node.id,p]));pts.slice(1).forEach(p=>{let parent=parentMap.get(p.node.id),q=lookup.get(parent?.id);if(q)drawLine(q,p,p.side,p.level===1?(p.node.tone||'#5775ac'):p.level===2?'#7c9dc9':'#a6bdd8')});pts.forEach(drawNode);let vals=pts.map(p=>({x0:p.x-textWidth(p.level)/2-28,x1:p.x+textWidth(p.level)/2+28,y0:p.y-54,y1:p.y+54}));ext={minX:Math.min(...vals.map(v=>v.x0)),maxX:Math.max(...vals.map(v=>v.x1)),minY:Math.min(...vals.map(v=>v.y0)),maxY:Math.max(...vals.map(v=>v.y1))};if(fit)fitToScreen();else update()}function update(){vp.setAttribute('transform',`translate(${pos.x},${pos.y}) scale(${pos.scale})`)}function fitToScreen(){const w=svg.clientWidth||800,h=svg.clientHeight||600,margin=65;let bw=ext.maxX-ext.minX,bh=ext.maxY-ext.minY;pos.scale=Math.min(1.3,Math.max(.16,Math.min((w-margin)/bw,(h-margin)/bh)));pos.x=w/2-(ext.minX+ext.maxX)/2*pos.scale;pos.y=h/2-(ext.minY+ext.maxY)/2*pos.scale;update()}
function changeZoom(f,cx=svg.clientWidth/2,cy=svg.clientHeight/2){let old=pos.scale;pos.scale=Math.max(.11,Math.min(3.2,old*f));pos.x=cx-(cx-pos.x)*pos.scale/old;pos.y=cy-(cy-pos.y)*pos.scale/old;update()}
svg.addEventListener('wheel',e=>{e.preventDefault();const r=svg.getBoundingClientRect();changeZoom(e.deltaY>0?.89:1.12,e.clientX-r.left,e.clientY-r.top)},{passive:false});svg.addEventListener('pointerdown',e=>{if(e.target.closest('.node'))return;dragging=true;dragPoint={x:e.clientX,y:e.clientY};board.classList.add('dragging');svg.setPointerCapture(e.pointerId)});svg.addEventListener('pointermove',e=>{if(!dragging)return;pos.x+=e.clientX-dragPoint.x;pos.y+=e.clientY-dragPoint.y;dragPoint={x:e.clientX,y:e.clientY};update()});svg.addEventListener('pointerup',e=>{dragging=false;board.classList.remove('dragging')});svg.addEventListener('pointercancel',()=>{dragging=false;board.classList.remove('dragging')});
document.getElementById('zoomIn').onclick=()=>changeZoom(1.24);document.getElementById('zoomOut').onclick=()=>changeZoom(.80);document.getElementById('fit').onclick=()=>fitToScreen();document.getElementById('collapseAll').onclick=()=>{expanded.clear();expanded.add('root');render(true)};let allOpen=false;document.getElementById('toggleAll').onclick=()=>{expanded.clear();expanded.add('root');DATA.children.forEach(g=>{expanded.add(g.id);g.children.forEach(t=>{expanded.add(t.id)})});render(true)};
const detail=document.getElementById('detail');function setText(id,v){document.getElementById(id).textContent=v||''}function showDetail(n){setText('dtitle',n.name);setText('dtag',n.tag||'知识导图节点');let c=document.getElementById('dcontent');c.replaceChildren();const info=[['题型识别 / 说明',n.detail],['核心公式',n.formula],['考场算法',n.method],['易错提醒',n.trap],['例题',n.example]];info.forEach(([lab,txt])=>{if(!txt)return;const h=document.createElement('h4');h.textContent=lab;const p=document.createElement('p');p.textContent=txt;if(lab==='核心公式')p.className='fbox';if(lab==='易错提醒')p.className='warn';c.append(h,p)});let id=n.id.split('-')[0],jump=document.getElementById('jump');let trueId=n.id;while((!dict.get(trueId)?.formula)&&parentMap.get(trueId))trueId=parentMap.get(trueId).id;jump.href='资料分析_图文知识库.html#t-'+trueId;jump.style.display=(dict.get(trueId)?.level===2)?'inline-block':'none';detail.classList.add('open')};document.getElementById('close').onclick=()=>detail.classList.remove('open');
let delay=null;document.getElementById('search').addEventListener('input',e=>{let q=e.target.value.trim().toLowerCase();searchMatches.clear();if(q){for(const n of dict.values()){if(n.id==='root')continue;const hay=[n.name,n.detail,n.formula,n.method,n.trap,n.example].filter(Boolean).join(' ').toLowerCase();if(hay.includes(q)){searchMatches.add(n.id);let p=parentMap.get(n.id);while(p){expanded.add(p.id);p=parentMap.get(p.id)}}}}render(q.length>0)});render(true);window.addEventListener('resize',()=>fitToScreen());
</script></body></html>
